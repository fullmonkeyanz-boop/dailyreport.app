<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日報</title>
<meta name="description" content="作業者ごとの日次勤務時間を製番単位で記録し、暦月集計と20日締め集計を自動算出する勤怠管理ツール(Firebase版・スタンドアロン)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --bg:#eceff2;
  --surface:#ffffff;
  --surface-2:#f4f6f8;
  --border:#d9dee4;
  --border-strong:#b9c2cc;
  --text:#151d26;
  --text-muted:#5c6773;
  --text-faint:#8b95a1;
  --accent:#1f5c6b;
  --accent-strong:#153f4a;
  --accent-soft:#dbeaed;
  --accent-soft-strong:#c3dee2;
  --amber:#9c6412;
  --amber-soft:#f3e6cd;
  --red:#a63a3a;
  --red-soft:#f5dede;
  --green:#2f7a55;
  --green-soft:#dcefe3;
  --shadow:0 1px 2px rgba(15,23,32,.07),0 8px 20px rgba(15,23,32,.06);
  --radius-s:6px;
  --radius-m:12px;
  --font-display:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  --font-body:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c;
    --surface:#1a222a;
    --surface-2:#212a33;
    --border:#2d3944;
    --border-strong:#3d4b58;
    --text:#e8edf1;
    --text-muted:#a3afbb;
    --text-faint:#707c88;
    --accent:#6cb3c0;
    --accent-strong:#8fc9d4;
    --accent-soft:#1e3a40;
    --accent-soft-strong:#254852;
    --amber:#d6a355;
    --amber-soft:#3a2f1a;
    --red:#e08a8a;
    --red-soft:#3a2424;
    --green:#7ec49b;
    --green-soft:#1f3327;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#11161c;
  --surface:#1a222a;
  --surface-2:#212a33;
  --border:#2d3944;
  --border-strong:#3d4b58;
  --text:#e8edf1;
  --text-muted:#a3afbb;
  --text-faint:#707c88;
  --accent:#6cb3c0;
  --accent-strong:#8fc9d4;
  --accent-soft:#1e3a40;
  --accent-soft-strong:#254852;
  --amber:#d6a355;
  --amber-soft:#3a2f1a;
  --red:#e08a8a;
  --red-soft:#3a2424;
  --green:#7ec49b;
  --green-soft:#1f3327;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ============ shell ============ */
.app-shell{max-width:720px;margin:0 auto;padding:0 0 96px;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 16px 0;
}
.topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:12px;flex-wrap:wrap;row-gap:4px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .mark{
  font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:.02em;color:var(--accent-strong);
}
.brand .sub{font-size:11.5px;color:var(--text-faint);letter-spacing:.02em}
.who{display:flex;align-items:baseline;gap:8px}
.who .who-name{font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:.02em;color:var(--text)}
.who button{background:none;border:none;color:var(--accent);font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.bento-link-big{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 12px;border-radius:var(--radius-m);
  background:var(--accent);color:#fff!important;font-weight:800;font-size:12.5px;letter-spacing:.01em;
  text-decoration:none;min-height:20px;box-shadow:var(--shadow);
}
.bento-link-big:active{background:var(--accent-strong)}
.bento-link-wrap{text-align:center;margin:0 0 12px}
.bento-cal-big .dnum{font-size:16px}
.bento-cal-big .dhour{font-size:12.5px}
.bento-cal-big .day-cell{min-height:52px}

.tabs{display:flex;gap:2px;padding:0 0 0}
.tab{
  flex:1;text-align:center;padding:10px 6px;border:none;background:none;
  color:var(--text-muted);font-weight:500;font-size:13.5px;
  border-bottom:2.5px solid transparent;min-height:44px;
}
.tab[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent);font-weight:700}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.view{padding:18px 16px 0}
.stack{display:flex;flex-direction:column;gap:14px}

/* ============ primitives ============ */
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-m);
  padding:16px;
  box-shadow:var(--shadow);
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-head h2{font-size:15.5px}
.panel-title-row{display:flex;align-items:center;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.06em;color:var(--text-faint);font-weight:700;text-transform:uppercase}
.caption{font-size:12px;color:var(--text-muted);line-height:1.6}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:var(--radius-s);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;min-height:40px;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent-strong)}
.btn-danger{border-color:var(--red);color:var(--red);background:transparent}
.btn-sm{padding:6px 10px;min-height:32px;font-size:12.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:5px}
.field[hidden]{display:none}
.field label{font-size:12px;color:var(--text-muted);font-weight:600}
.field input[type="text"],.field input[type="password"],.field input[type="number"],.field input[type="date"],.field select,.field textarea{
  border:1px solid var(--border-strong);border-radius:var(--radius-s);background:var(--surface-2);
  padding:9px 10px;min-height:40px;color:var(--text);width:100%;
}
.field textarea{font-family:inherit;font-size:13px;resize:vertical;line-height:1.5}
.field input[type="date"]{max-width:140px;padding:9px 6px;font-size:13px}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.field-warn label{color:var(--red)}
.field-warn input{border-color:var(--red);background:var(--red-soft)}
.field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field-row>.field{min-width:0}
.field-row>.field input,.field-row>.field select{min-width:0}
.num-input{font-family:var(--font-mono);text-align:right}
@media (max-width:380px){
  .field-row{grid-template-columns:1fr}
  .field input[type="date"]{max-width:none}
}

.check-grid{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-s);background:var(--surface-2)}
.check-item{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.check-item input{width:16px;height:16px;flex-shrink:0}
.travel-row{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;display:flex;flex-direction:column;gap:4px}
.travel-row .trow-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.travel-row .trow-amount{font-family:var(--font-mono)}
.travel-row .trow-sub{font-size:12.5px;color:var(--text-muted)}
.travel-row .trow-btns{display:flex;gap:8px;margin-top:4px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.chip-amber{background:var(--amber-soft);color:var(--amber)}
.chip-red{background:var(--red-soft);color:var(--red)}
.chip-green{background:var(--green-soft);color:var(--green)}
.chip-accent{background:var(--accent-soft);color:var(--accent-strong)}
.chip-muted{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}

.divider{height:1px;background:var(--border);border:none;margin:2px 0}

.toast-wrap{position:fixed;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{
  background:var(--accent-strong);color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;
  max-width:min(88vw,340px);white-space:normal;text-align:center;line-height:1.4;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--red)}

.modal-overlay{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:70}
@media (min-width:560px){.modal-overlay{align-items:center}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
@media (min-width:560px){.modal{border-radius:var(--radius-m)}}

/* ============ worker picker ============ */
.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.worker-btn{
  border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--radius-s);
  padding:14px 8px;font-weight:600;font-size:14px;text-align:center;min-height:52px;
}
.worker-btn:hover{border-color:var(--accent);color:var(--accent-strong)}

/* ============ month nav ============ */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month-nav .label{font-family:var(--font-display);font-weight:700;font-size:16px}
.icon-btn.spinning{animation:icon-spin .8s linear infinite}
@keyframes icon-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ============ pull to refresh ============ */
.pull-indicator{
  display:none;align-items:center;justify-content:center;gap:6px;padding:8px 0;
  font-size:12.5px;color:var(--text-muted);font-weight:600;transition:opacity .15s;
}
.icon-btn{
  width:36px;height:36px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
}

/* ============ day grid ============ */
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dow{text-align:center;font-size:10.5px;color:var(--text-faint);font-weight:700;padding-bottom:2px}
.day-cell{
  position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-height:44px;
}
.day-cell .dnum{font-size:12.5px;font-weight:600;color:var(--text)}
.day-cell .dhour{font-family:var(--font-mono);font-size:9.5px;color:var(--accent-strong);font-weight:700}
.day-cell.off{background:transparent;border-color:transparent}
.day-cell.holiday{background:var(--red-soft)}
.day-cell.holiday .dnum{color:var(--red)}
.day-cell.today{box-shadow:0 0 0 2px var(--accent) inset}
.day-cell.selected{background:var(--accent);border-color:var(--accent)}
.day-cell.selected .dnum,.day-cell.selected .dhour{color:#fff}
.day-cell.has-entry:not(.selected){border-color:var(--accent-soft-strong)}
.day-cell.leave-dot::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:99px;background:var(--amber)}
.day-cell.selected.leave-dot::after{background:#fff}

/* ============ day form ============ */
.day-form-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px}
.total-badge{
  margin-left:auto;font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--accent-strong);
  background:var(--accent-soft);padding:4px 10px;border-radius:var(--radius-s);
}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid6{grid-template-columns:repeat(2,1fr)}}
.item-row{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:end}
.item-sum-note{font-size:11.5px;color:var(--text-faint);text-align:right}
.item-sum-note.warn{color:var(--amber);font-weight:700}

/* ============ ledger table ============ */
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-s)}
table.ledger{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
table.ledger.ledger-compact{min-width:0;width:100%;table-layout:fixed}
table.ledger.ledger-compact th:last-child,table.ledger.ledger-compact td:last-child{width:76px}
table.ledger.ledger-compact th:first-child,table.ledger.ledger-compact td:first-child{white-space:normal;position:static;word-break:break-word}
table.ledger th,table.ledger td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.ledger th:first-child,table.ledger td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600}
table.ledger thead th{background:var(--surface-2);color:var(--text-muted);font-weight:700;font-size:11px;letter-spacing:.02em}
table.ledger tbody tr:last-child td{border-bottom:none}
table.ledger td{font-family:var(--font-mono)}
table.ledger td:first-child{font-family:var(--font-body)}
table.ledger tfoot td{font-weight:700;background:var(--surface-2);border-top:1.5px solid var(--border-strong)}

/* ============ master list rows ============ */
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-row .name{font-weight:600;flex:1}
.list-row .code{font-family:var(--font-mono);color:var(--text-muted);font-size:12px;min-width:34px}
.switch{position:relative;width:38px;height:22px;border-radius:99px;background:var(--border-strong);border:none;flex-shrink:0}
.switch[aria-checked="true"]{background:var(--accent)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]::after{transform:translateX(16px)}

.dow-select{display:flex;gap:6px;flex-wrap:wrap}
.dow-pill{padding:8px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-2);font-size:12.5px;font-weight:700}
.dow-pill[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}

/* ============ 弁当注文 ============ */
.bento-banner{margin:10px 16px 0;background:var(--accent-soft);border-color:var(--accent-soft-strong)}
.bento-banner p{margin:0}
.bento-banner.closed{background:var(--surface-2);border-color:var(--border)}
table.ledger.bento-table{min-width:0;width:auto;table-layout:auto}
table.ledger.bento-table th,table.ledger.bento-table td{padding:2px 1px;text-align:center}
table.ledger.bento-table th:first-child,table.ledger.bento-table td:first-child{text-align:left;padding-left:4px;white-space:nowrap}
table.ledger.bento-table th.bento-name-th{
  writing-mode:vertical-rl;white-space:nowrap;
  font-size:10.5px;font-weight:700;padding:5px 0 3px;vertical-align:bottom;
}
.order-table-wrap{max-height:58vh;overflow-y:auto}
table.ledger.bento-table thead th{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--border)}
.order-cell{
  width:100%;min-width:20px;min-height:26px;border-radius:5px;border:1px solid var(--border-strong);
  background:var(--surface-2);font-family:var(--font-mono);font-weight:700;font-size:11px;color:var(--text);
  touch-action:none;padding:0;
}
table.ledger.bento-table td.bento-yen-cell{font-size:8px;letter-spacing:-.02em;white-space:nowrap;padding-left:1px;padding-right:1px;border-right:1px solid var(--border)}
table.ledger.bento-table td.bento-yen-cell:last-child{border-right:none}
.order-cell[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.order-cell.locked{opacity:.4;pointer-events:none}
tr.bento-row-holiday td{background:var(--red-soft)}

.gate-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 16px;gap:14px}
.gate-wrap .icon{font-size:30px}

footer.app-footer{padding:22px 16px 0;text-align:center}
footer.app-footer p{font-size:11px;color:var(--text-faint)}
.gate-code-input{font-family:var(--font-mono);letter-spacing:.3em;text-align:center;font-size:20px}
</style>
</head>

<script>
(function(){
"use strict";

/* ---- デバッグ用: 予期しないJSエラーが出たら画面上部に赤いバナーで表示する。
   携帯だけで弁当ボタンが反応しない不具合の原因調査用。原因が分かったら削除してよい。 ---- */
(function(){
  var shown = 0;
  function showErrBanner(text){
    shown++;
    if (shown > 5) return; // 大量発生時に画面を埋め尽くさない
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;'+
      'font-size:11px;line-height:1.4;padding:8px 10px;white-space:pre-wrap;word-break:break-all;'+
      'top:' + ((shown-1)*46) + 'px;';
    box.textContent = 'JSエラー: ' + text;
    document.body.appendChild(box);
  }
  window.addEventListener('error', function(e){
    showErrBanner((e.message||String(e)) + ' (' + (e.filename||'') + ':' + (e.lineno||'') + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    showErrBanner('Promise: ' + (r && r.message ? r.message : String(r)));
  });
})();

/* ================= constants ================= */
var DOW_LABELS = ['日','月','火','水','木','金','土'];
var SALT = 'seiban-nippou-v1::';
var TABS = [
  {id:'input', label:'入力'},
  {id:'travel', label:'旅費交通費精算'},
  {id:'master', label:'マスター'}

/* ================= utils ================= */
function pad2(n){ return (n<10?'0':'')+n; }
function ymd(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function yyyymm(y,m){ return ''+y+pad2(m); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function round2(n){ return Math.round(n*100)/100; }
function fmtHour(n){
  n = round2(n);
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n)) + '.0';
  return String(n);
}
function escCsv(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if (/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function toCsv(rows){
  return '﻿' + rows.map(function(r){ return r.map(escCsv).join(','); }).join('\r\n');
}
function prevMonth(y,m){ return m===1 ? {y:y-1,m:12} : {y:y,m:m-1}; }
function nextMonth(y,m){ return m===12 ? {y:y+1,m:1} : {y:y,m:m+1}; }
function dowOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function workerName(id){ var w = state.workers.find(function(x){return x.id===id;}); return w ? w.name : ''; }
function workItemLabel(code){
  var it = state.workItems.find(function(x){return x.code===code;});
  return it ? (it.code+' '+it.name) : code;
}
function activeWorkers(){ return state.workers.filter(function(w){return w.active!==false;}).sort(function(a,b){return (a.order||0)-(b.order||0);}); }
function activeWorkItems(){ return state.workItems.filter(function(w){return w.active!==false;}).sort(function(a,b){return (a.order||0)-(b.order||0);}); }

function isHoliday(dateStr){
  var ex = state.holidayExceptions[dateStr];
  if (ex) return ex.type === 'holiday';
  var dow = dowOf(dateStr);
  return (state.holidaySettings.weeklyOff||[]).indexOf(dow) !== -1;
}

function emptyDay(){
  return {paidLeave:0,late:0,earlyLeave:0,absence:0,overtime:0,holidayWork:0,travel:0,items:[]};
}
function getDay(monthDoc, day){
  var key = pad2(day);
  if (monthDoc && monthDoc.days && monthDoc.days[key]) return monthDoc.days[key];
  return emptyDay();
}
function computeTotal(dateStr, day){
  // 勤務時間は入力された製番・作業内容の時間の合計とする
  var items = day.items || [];
  var t = items.reduce(function(s,it){ return s + num(it.hours); }, 0);
  return round2(t);
}
function displayTotal(dateStr, day, total){
  var noWork = total === 0 && (num(day.paidLeave)>0 || num(day.absence)>0 || (isHoliday(dateStr) && num(day.holidayWork)===0));
  return noWork ? '－' : fmtHour(total);
}

}

/* ================= hashing ================= */
function sha256Hex(text){
  var enc = new TextEncoder().encode(SALT + text);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    var arr = Array.from(new Uint8Array(buf));
    return arr.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}

function startListeners(db){
  if (state._listenersStarted) return;
  state._listenersStarted = true;

  db.doc('settings/access').onSnapshot(function(snap){
    state.accessDoc = snap.exists ? snap.data() : null;
    render();
  }, function(){ state.accessDoc = null; render(); });

  db.collection('workers').orderBy('order').onSnapshot(function(snap){
    if (snap.empty && snap.docs.length===0 && !state._seededWorkers){
      state._seededWorkers = true;
      SEED_WORKERS.forEach(function(name,i){
        db.collection('workers').add({name:name, order:i, active:true});
      });
    }
    state.workers = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.ready = true;
    render();
  }, function(){ state.ready = true; render(); });

  db.collection('workItems').orderBy('order').onSnapshot(function(snap){
    if (snap.empty && snap.docs.length===0 && !state._seededItems){
      state._seededItems = true;
      SEED_ITEMS.forEach(function(it,i){
        db.collection('workItems').doc(it.code).set({code:it.code, name:it.name, order:i, active:true});
      });
    }
    state.workItems = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    // 「雑用」を「雑用その他」に1回だけ自動でリネーム(既存の登録データ向け)
    var zatsuyou = state.workItems.find(function(w){ return w.code===ZATSUYOU_CODE && w.name==='雑用'; });
    if (zatsuyou && !state._renamedZatsuyou){
      state._renamedZatsuyou = true;
      db.collection('workItems').doc(zatsuyou.id).update({name:'雑用その他'});
    }
    render();
  });

  db.doc('settings/travelMaster').onSnapshot(function(snap){
    state.travelMaster = Object.assign({
      workers: TRAVEL_WORKERS.slice(),
      summaryOptions: TRAVEL_SUMMARY_OPTIONS.slice(),
      siteStaff: TRAVEL_SITE_STAFF_OPTIONS.slice(),
      siteWorkContent: TRAVEL_SITE_WORK_CONTENT.slice(),
      defaultStaff: TRAVEL_DEFAULT_STAFF
    }, snap.exists ? snap.data() : {});
    render();
  });

  db.doc('settings/bento').onSnapshot(function(snap){
    state.bentoSettings = Object.assign({}, SEED_BENTO_SETTINGS, snap.exists ? snap.data() : {});
    render();
  });

  db.doc('settings/holiday').onSnapshot(function(snap){
    state.holidaySettings = snap.exists ? Object.assign({weeklyOff:[0,6]}, snap.data()) : {weeklyOff:[0,6]};
    render();
  });

  db.collection('holidays').onSnapshot(function(snap){
    var map = {};
    snap.docs.forEach(function(d){ map[d.id] = d.data(); });
    state.holidayExceptions = map;
    render();
  });

  db.doc('settings/admin').get().then(function(snap){
    state._adminDoc = snap.exists ? snap.data() : null;
    render();
  });
}

function subscribeMonthDoc(){

function saveDay(dateStr, dayData, onSaved){
  if (!state.db || !state.workerId) return;
  var parts = dateStr.split('-');
  var y = +parts[0], m = +parts[1], d = +parts[2];
  var total = computeTotal(dateStr, dayData);
  dayData = Object.assign({}, dayData, {total: total});
  var id = state.workerId + '_' + yyyymm(y,m);
  var ref = state.db.doc('entries/' + id);
  var key = pad2(d);
  ref.get().then(function(snap){
    if (!snap.exists){
      var days = {}; days[key] = dayData;
      return ref.set({workerId: state.workerId, yyyymm: yyyymm(y,m), days: days, updatedAt: Date.now()});
    } else {
      var patch = {updatedAt: Date.now()};
      patch['days.' + key] = dayData;
      return ref.update(patch);
    }
  }).then(function(){
    toast('✓ '+(+parts[1])+'月'+d+'日を保存しました（'+fmtHour(total)+' h）');
    if (onSaved) onSaved();
  }).catch(function(){
    toast('保存に失敗しました', true);
  });
}
function fetchMonthDoc(workerId, y, m){
  if (!state.db) return Promise.resolve({days:{}});
  var id = workerId + '_' + yyyymm(y,m);
  return state.db.doc('entries/' + id).get().then(function(snap){
    return snap.exists ? snap.data() : {days:{}};
  });
}

/* ================= aggregation ================= */
function computeCalendarMonth(monthDoc, y, m){
  var dim = daysInMonth(y,m);
  var sums = {paidLeave:0,late:0,earlyLeave:0,absence:0,overtime:0,holidayWork:0,travel:0};
  var workDays = 0, actualTotal = 0;
  for (var d=1; d<=dim; d++){
    var dateStr = ymd(y,m,d);
    var day = getDay(monthDoc, d);
    var total = (day.total!==undefined) ? day.total : computeTotal(dateStr, day);
    actualTotal += total;
    if (total > 0) workDays++;
    FIELD_DEFS.forEach(function(f){ sums[f.key] += num(day[f.key]); });
  }
  return {workDays:workDays, workHours: round2(actualTotal), sums: sums};
}
function computeCutoff(prevDoc, curDoc, y, m){
  var pv = prevMonth(y,m);
  var pDim = daysInMonth(pv.y, pv.m);
  var sums = {paidLeave:0,late:0,earlyLeave:0,absence:0,overtime:0,holidayWork:0,travel:0};
  for (var d=21; d<=pDim; d++){
    var day = getDay(prevDoc, d);
    FIELD_DEFS.forEach(function(f){ sums[f.key] += num(day[f.key]); });
  }
  for (var d2=1; d2<=20; d2++){
    var day2 = getDay(curDoc, d2);
    FIELD_DEFS.forEach(function(f){ sums[f.key] += num(day2[f.key]); });
  }
  var label = pv.y+'/'+pad2(pv.m)+'/21 〜 '+y+'/'+pad2(m)+'/20';
  return {sums:sums, label:label};
}

}

function loadSummary(y,m,manual){
  if (manual){ state.summaryRefreshing = true; render(); }
  var pv = prevMonth(y,m);
  var workers = activeWorkers();
  var promises = workers.map(function(w){
    return Promise.all([fetchMonthDoc(w.id,y,m), fetchMonthDoc(w.id,pv.y,pv.m)]);
  });
  Promise.all(promises).then(function(results){
    var calendar = {}, cutoff = {}, cutoffLabel = '';
    workers.forEach(function(w, i){
      var curDoc = results[i][0], prevDoc = results[i][1];
      calendar[w.id] = computeCalendarMonth(curDoc, y, m);
      var co = computeCutoff(prevDoc, curDoc, y, m);
      cutoff[w.id] = co;
      cutoffLabel = co.label;
    });
    state._summaryCache = {key:y+'-'+m, calendar:calendar, cutoff:cutoff, cutoffLabel:cutoffLabel, y:y, m:m, docs:results, workers:workers};
    if (manual){ state.summaryRefreshing = false; toast('最新のデータに更新しました'); }
    render();
  }).catch(function(){
    if (manual){ state.summaryRefreshing = false; toast('更新に失敗しました', true); render(); }
  });
}
function refreshSummary(){

  loadSummary(state.summaryYM.y, state.summaryYM.m, true);
}

function computeMonthDayTotals(cache, y, m){
  var dim = daysInMonth(y,m);
  var totals = {};
  for (var d=1; d<=dim; d++) totals[d] = 0;
  cache.workers.forEach(function(w,i){
    var doc = cache.docs[i][0];
    for (var d=1; d<=dim; d++){
      var dayData = getDay(doc, d);
      (dayData.items||[]).forEach(function(it){
        if (it.code) totals[d] += num(it.hours);
      });
    }
  });
  return totals;
}
function computeDayItemBreakdown(cache, d){
  var groups = {}, order = [];
  cache.workers.forEach(function(w,i){
    var doc = cache.docs[i][0];
    var dayData = getDay(doc, d);
    (dayData.items||[]).forEach(function(it){
      if (!it.code) return;
      var key, label;
      if (it.code === ZATSUYOU_CODE && it.note){
        key = ZATSUYOU_CODE + '::' + it.note;
        label = workItemLabel(it.code) + '（'+it.note+'）';
      } else {
        key = it.code;
        label = workItemLabel(it.code);
      }
      if (!groups[key]){ groups[key] = {label:label, hours:0}; order.push(key); }
      groups[key].hours += num(it.hours);
    });
  });
  return order.map(function(k){ return groups[k]; }).sort(function(a,b){ return b.hours - a.hours; });
}

    );

  return (

      '<div class="day-grid">' + dowRow + cells + '</div>' +

function downloadCsv(filename, text){
  var blob = new Blob([text], {type: 'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

    cache.workers.forEach(function(w){
      var c = cache.calendar[w.id];
      rows.push([w.name,c.workDays,fmtHour(c.workHours),fmtHour(c.sums.paidLeave),fmtHour(c.sums.late),fmtHour(c.sums.earlyLeave),fmtHour(c.sums.absence),fmtHour(c.sums.holidayWork),fmtHour(c.sums.overtime),fmtHour(c.sums.travel)]);
    });
    filename = '暦月集計_'+y+pad2(m)+'.csv';
  } else if (kind === 'cutoff'){
    rows = [['対象期間',cache.cutoffLabel],[],['氏名','早出残業(h)','遅刻(h)','早退(h)','有休(h)','欠勤(h)','休出(h)','往復(h)']];
    cache.workers.forEach(function(w){
      var c = cache.cutoff[w.id].sums;
      rows.push([w.name,fmtHour(c.overtime),fmtHour(c.late),fmtHour(c.earlyLeave),fmtHour(c.paidLeave),fmtHour(c.absence),fmtHour(c.holidayWork),fmtHour(c.travel)]);
    });
    filename = '20日締め集計_'+y+pad2(m)+'.csv';
  } else if (kind === 'daily'){
    exportDailyDetailExcel(cache, y, m);
    return;
  } else if (kind === 'items'){
    var totals = {};
    cache.workers.forEach(function(w, i){
      var doc = cache.docs[i][0];
      var dim = daysInMonth(y,m);
      for (var d=1; d<=dim; d++){
        var day = getDay(doc, d);
        (day.items||[]).forEach(function(it){
          if (!it.code) return;
          totals[it.code] = (totals[it.code]||0) + num(it.hours);
        });
      }
    });
    rows = [['製番','名称','合計時間(h)']];
    Object.keys(totals).sort().forEach(function(code){
      rows.push([code, workItemLabel(code).replace(code+' ',''), fmtHour(totals[code])]);
    });
    filename = '製番別集計_'+y+pad2(m)+'.csv';
  }
  try {
    downloadCsv(filename, toCsv(rows));
    toast('CSVをダウンロードしました');
  } catch (e){
    toast('出力に失敗しました', true);
  }
}
function safeSheetName(name, fallback){
  var s = (name || fallback || 'Sheet').replace(/[\\/*?:\[\]]/g, '_');
  s = s.slice(0, 31);
  return s || fallback || 'Sheet';
}
function exportDailyDetailExcel(cache, y, m){
  if (typeof ExcelJS === 'undefined'){ toast('Excel出力ライブラリの読み込みに失敗しました', true); return; }
  var dim = daysInMonth(y,m);
  var headerRow = ['日付','曜日','区分','有休','遅刻','早退','欠勤','早出残業','休出','時間計','製番・作業内容','現場往復'];

  var wb = new ExcelJS.Workbook();
  var usedNames = {};
  cache.workers.forEach(function(w, i){
    var doc = cache.docs[i][0];
    var baseName = safeSheetName(w.name, '作業者'+(i+1));
    var sheetName = baseName;
    var n = 2;
    while (usedNames[sheetName]){ sheetName = safeSheetName(baseName.slice(0,28)+'_'+n, '作業者'+(i+1)); n++; }
    usedNames[sheetName] = true;

    var ws = wb.addWorksheet(sheetName);
    ws.columns = [{width:12},{width:8},{width:8},{width:8},{width:8},{width:8},{width:8},{width:10},{width:8},{width:10},{width:30},{width:10}];

    ws.mergeCells(1,1,1,12);
    ws.getCell(1,1).value = (w.name||'')+'さん　'+y+'年'+m+'月　日別明細';
    ws.getCell(1,1).font = {bold:true, size:13};

    var headerRowIdx = 3;
    ws.getRow(headerRowIdx).values = headerRow;
    ws.getRow(headerRowIdx).font = {bold:true};
    headerFill(ws, headerRowIdx, 1, headerRowIdx, 12);

    var r = headerRowIdx;
    for (var d=1; d<=dim; d++){
      r++;
      var dateStr = ymd(y,m,d);
      var day = getDay(doc, d);
      var total = (day.total!==undefined)?day.total:computeTotal(dateStr,day);
      var itemsText = (day.items||[]).map(function(it){ return it.code+(it.note?'('+it.note+')':'')+':'+fmtHour(num(it.hours)); }).join('、');
      ws.getRow(r).values = [
        dateStr, DOW_LABELS[dowOf(dateStr)], isHoliday(dateStr)?'休日':'平日',
        fmtHour(day.paidLeave)||'', fmtHour(day.late), fmtHour(day.earlyLeave), fmtHour(day.absence),
        fmtHour(day.overtime), fmtHour(day.holidayWork), displayTotal(dateStr,day,total), itemsText, fmtHour(day.travel)
      ];
    }
    applyBorder(ws, headerRowIdx, 1, r, 12);
  });

  downloadWorkbook(wb, '日別明細_'+y+pad2(m)+'.xlsx');
}

function goToInputTop(){
  state.view = 'input';
  if (state.workerId){ ensureInputYM(); subscribeMonthDoc(); }
  render();

function ensureTravelYM(){
  if (!state.travelYM) state.travelYM = {y:TODAY.y, m:TODAY.m};
}
function travelMonthKey(y,m){ return yyyymm(y,m); }
function unsubscribeTravel(){
  if (state.travelHeaderUnsub){ state.travelHeaderUnsub(); state.travelHeaderUnsub = null; }
  if (state.travelRowsUnsub){ state.travelRowsUnsub(); state.travelRowsUnsub = null; }
}
function subscribeTravelMonth(){
  unsubscribeTravel();
  state.travelHeader = null;
  state.travelRows = [];
  state.travelEditId = null;
  state.travelPrevCarryDefault = null;
  if (!state.db || !state.travelYM){ render(); return; }
  var key = travelMonthKey(state.travelYM.y, state.travelYM.m);
  state.travelHeaderUnsub = state.db.doc('travelExpenses/'+key).onSnapshot(function(snap){
    state.travelHeader = snap.exists ? snap.data() : {};
    render();
  });
  state.travelRowsUnsub = state.db.collection('travelExpenses/'+key+'/rows').orderBy('date').onSnapshot(function(snap){
    state.travelRows = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  });
  loadTravelPrevCarry(state.travelYM.y, state.travelYM.m);
}
function loadTravelPrevCarry(y, m){
  if (!state.db) return;
  var pm = prevMonth(y, m);
  var key = travelMonthKey(pm.y, pm.m);
  Promise.all([
    state.db.doc('travelExpenses/'+key).get(),
    state.db.collection('travelExpenses/'+key+'/rows').get()
  ]).then(function(results){
    // 別の月へ移動済みなら破棄
    if (!state.travelYM || state.travelYM.y !== y || state.travelYM.m !== m) return;
    var headerSnap = results[0], rowsSnap = results[1];
    var h = headerSnap.exists ? headerSnap.data() : {};
    var prevBalance = num(h.prevBalance);
    var advance = num(h.advance);
    var rowsTotal = rowsSnap.docs.reduce(function(s,d){ return s + travelRowTotal(d.data()); }, 0);
    state.travelPrevCarryDefault = prevBalance + advance - rowsTotal;
    render();
  }).catch(function(){ /* 前月データなしなど。既定値0のままにする */ });
}
function travelRowMealAmount(row){
  if (!row) return 0;
  return travelAllowanceAmount({area: row.mealArea, dinner: row.mealDinner, workers: row.workers});
}
function travelRowTotal(row){
  return num(row.amount) + travelRowMealAmount(row);
}
function distinctContractors(){
  var seen = {}, list = [];
  activeWorkItems().forEach(function(it){
    var c = (it.contractor||'').trim();
    if (c && !seen[c]){ seen[c] = true; list.push(c); }
  });
  return list;
}
function travelHeaderField(key, fallback){
  var h = state.travelHeader || {};
  return (h[key]!==undefined && h[key]!==null && h[key]!=='') ? h[key] : fallback;
}
function saveTravelHeader(patch){
  if (!state.db || !state.travelYM) return;
  var key = travelMonthKey(state.travelYM.y, state.travelYM.m);
  state.db.doc('travelExpenses/'+key).set(patch, {merge:true});
}

function bindTravelMonthlyView(){
  var p = document.querySelector('[data-act="t-prev"]');
  var n = document.querySelector('[data-act="t-next"]');
  if (p) p.addEventListener('click', function(){ state.travelYM = prevMonth(state.travelYM.y, state.travelYM.m); subscribeTravelMonth(); render(); });
  if (n) n.addEventListener('click', function(){ state.travelYM = nextMonth(state.travelYM.y, state.travelYM.m); subscribeTravelMonth(); render(); });

  var closeBtn = document.querySelector('[data-act="t-close"]');
  if (closeBtn) closeBtn.addEventListener('click', function(){ goToInputTop(); });

  var staffEl = document.getElementById('tStaffName');
  if (staffEl) staffEl.addEventListener('change', function(){ saveTravelHeader({staffName: staffEl.value}); });
  var settleEl = document.getElementById('tSettleDate');
  if (settleEl) settleEl.addEventListener('change', function(){ saveTravelHeader({settleDate: settleEl.value}); });
  var prevBalEl = document.getElementById('tPrevBalance');
  if (prevBalEl) prevBalEl.addEventListener('change', function(){ saveTravelHeader({prevBalance: num(prevBalEl.value)}); });
  var advEl = document.getElementById('tAdvance');
  if (advEl) advEl.addEventListener('change', function(){ saveTravelHeader({advance: num(advEl.value)}); });

  var itemSel = document.getElementById('tItemSelect');

    var siteEl = document.getElementById('tSiteName');
    if (siteEl) siteEl.value = it.name || '';
    if (it.contractor){
      document.querySelectorAll('input[data-tcheck="contractor"]').forEach(function(b){

      });
    }
  });

  var cancelBtn = document.querySelector('[data-act="t-cancel-edit"]');
  if (cancelBtn) cancelBtn.addEventListener('click', function(){ state.travelEditId = null; render(); });

  var saveBtn = document.querySelector('[data-act="t-save-row"]');
  if (saveBtn) saveBtn.addEventListener('click', saveTravelRow);

  document.querySelectorAll('[data-tedit]').forEach(function(el){
    el.addEventListener('click', function(){ state.travelEditId = el.getAttribute('data-tedit'); render(); });

    el.addEventListener('click', function(){
      var id = el.getAttribute('data-tdel');
      confirmModal('削除しますか', 'この明細を削除します。元に戻せません。', function(){ deleteTravelRow(id); });
    });
  });

  var exportBtn = document.querySelector('[data-act="t-export"]');
  if (exportBtn) exportBtn.addEventListener('click', exportTravelExcel);
}
function saveTravelRow(){
  if (!state.db || !state.travelYM) return;
  var dateEl = document.getElementById('tDate');
  var date = dateEl ? dateEl.value : '';
  var siteName = (document.getElementById('tSiteName')||{}).value || '';
  siteName = siteName.trim();
  var itemCode = (document.getElementById('tItemSelect')||{}).value || '';
  var store = ((document.getElementById('tStore')||{}).value || '').trim();
  var amount = num((document.getElementById('tAmount')||{}).value);
  var contractors = Array.from(document.querySelectorAll('input[data-tcheck="contractor"]:checked')).map(function(b){ return b.value; });
  var workers = Array.from(document.querySelectorAll('input[data-tcheck="worker"]:checked')).map(function(b){ return b.value; });
  var summary = Array.from(document.querySelectorAll('input[data-tcheck="summary"]:checked')).map(function(b){ return b.value; });
  var mealAreaEl = document.querySelector('input[name="tMealArea"]:checked');
  var mealArea = mealAreaEl ? mealAreaEl.value : 'in';
  var mealDinner = !!(document.getElementById('tMealDinner')||{}).checked;
  var mealAmount = travelAllowanceAmount({area:mealArea, dinner:mealDinner, workers:workers});

  if (!date){ toast('日付を入力してください', true); return; }
  var dupExists = state.travelRows.some(function(r){ return r.date === date && r.id !== state.travelEditId; });
  if (dupExists){ toast('同じ日付が既に登録されています。登録日をご確認ください', true); return; }
  if (!amount && !mealAmount){ toast('金額を入力してください', true); return; }

  var data = {date:date, itemCode:itemCode, siteName:siteName, contractors:contractors, workers:workers, summary:summary, store:store, amount:amount, mealArea:mealArea, mealDinner:mealDinner, updatedAt:Date.now()};
  var key = travelMonthKey(state.travelYM.y, state.travelYM.m);
  var col = state.db.collection('travelExpenses/'+key+'/rows');
  var isEdit = !!state.travelEditId;
  var p = isEdit
    ? col.doc(state.travelEditId).set(data, {merge:true})
    : col.add(Object.assign({createdAt:Date.now()}, data));

  p.then(function(){
    state.travelEditId = null;
    toast(isEdit ? '更新しました' : '追加しました');
    render();
  }).catch(function(){ toast('保存に失敗しました', true); });
}
function deleteTravelRow(id){
  if (!state.db || !state.travelYM) return;
  var key = travelMonthKey(state.travelYM.y, state.travelYM.m);
  state.db.collection('travelExpenses/'+key+'/rows').doc(id).delete().then(function(){
    toast('削除しました');
  }).catch(function(){ toast('削除に失敗しました', true); });
}
var THIN_BORDER = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
function applyBorder(ws, r1, c1, r2, c2){
  for (var r=r1; r<=r2; r++){
    for (var c=c1; c<=c2; c++){
      ws.getCell(r,c).border = THIN_BORDER;
    }
  }
}
function headerFill(ws, r1, c1, r2, c2){
  for (var r=r1; r<=r2; r++){
    for (var c=c1; c<=c2; c++){
      ws.getCell(r,c).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF0F0F0'}};
    }
  }
}
function downloadWorkbook(wb, filename){
  wb.xlsx.writeBuffer().then(function(buffer){
    var blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Excelをダウンロードしました');
  }).catch(function(){ toast('Excel出力に失敗しました', true); });
}
function exportTravelExcel(){
  if (typeof ExcelJS === 'undefined'){ toast('Excel出力ライブラリの読み込みに失敗しました', true); return; }
  var y = state.travelYM.y, m = state.travelYM.m;
  var staffName = travelHeaderField('staffName', state.travelMaster.defaultStaff);
  var prevCarryDefault = (state.travelPrevCarryDefault!==null && state.travelPrevCarryDefault!==undefined) ? state.travelPrevCarryDefault : 0;
  var prevBalance = num(travelHeaderField('prevBalance', prevCarryDefault));
  var advance = num(travelHeaderField('advance',0));
  var rows = state.travelRows.slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : 1; });
  var total = rows.reduce(function(s,r){ return s + travelRowTotal(r); }, 0);
  var carry = prevBalance + advance - total;

  var wb = new ExcelJS.Workbook();
  var ws = wb.addWorksheet(y+'年'+m+'月');
  ws.columns = [{width:12},{width:22},{width:20},{width:22},{width:18},{width:24},{width:12},{width:16}];

  ws.mergeCells(1,1,1,8);
  ws.getCell(1,1).value = m+'月分 旅費交通費精算書';
  ws.getCell(1,1).font = {bold:true, size:14};

  ws.getCell(2,1).value = '担当者名'; ws.getCell(2,1).font = {bold:true};
  ws.getCell(2,2).value = staffName;
  ws.getCell(2,4).value = '前月仮払残金額'; ws.getCell(2,4).font = {bold:true};
  ws.getCell(2,5).value = prevBalance;
  ws.getCell(3,4).value = '今月仮払金額'; ws.getCell(3,4).font = {bold:true};
  ws.getCell(3,5).value = advance;
  applyBorder(ws, 2, 1, 3, 5);

  var headerRowIdx = 5;
  ws.getRow(headerRowIdx).values = ['日付','請負会社','現場名','作業者','店名','摘要','金額','昼食・夕食代補助'];
  ws.getRow(headerRowIdx).font = {bold:true};
  headerFill(ws, headerRowIdx, 1, headerRowIdx, 8);

  var r = headerRowIdx;
  rows.forEach(function(row){
    r++;
    ws.getRow(r).values = [row.date||'', (row.contractors||[]).join('／'), row.siteName||'', (row.workers||[]).join('／'), row.store||'', (row.summary||[]).join('／'), num(row.amount), travelRowMealAmount(row)];
  });
  applyBorder(ws, headerRowIdx, 1, r, 8);

  var totalsRow1 = r + 2;
  ws.getCell(totalsRow1,7).value = '今月計'; ws.getCell(totalsRow1,7).font = {bold:true};
  ws.getCell(totalsRow1,8).value = total;
  var totalsRow2 = totalsRow1 + 1;
  ws.getCell(totalsRow2,7).value = '次月繰越金額'; ws.getCell(totalsRow2,7).font = {bold:true};
  ws.getCell(totalsRow2,8).value = carry;
  applyBorder(ws, totalsRow1, 7, totalsRow2, 8);

  downloadWorkbook(wb, '旅費交通費精算_'+y+pad2(m)+'.xlsx');
}

function subscribeTravelSiteDetail(id){
  unsubscribeTravelSiteDetail();

  state.travelSitePurchases = [];

  state.travelSiteAllowances = [];
  state.travelSiteEditPurchaseId = null;

  state.travelSiteEditAllowanceId = null;
  if (!state.db || !id){ render(); return; }
  state.travelSiteDocUnsub = state.db.doc('travelSiteExpenses/'+id).onSnapshot(function(snap){

    render();

  state.travelSiteAllowancesUnsub = state.db.collection('travelSiteExpenses/'+id+'/allowances').orderBy('date').onSnapshot(function(snap){

function travelAllowanceAmount(a){

function saveTravelSitePurchase(){
  if (!state.db || !state.travelSiteCurrentId) return;
  var date = (document.getElementById('tspDate')||{}).value || '';
  var store = ((document.getElementById('tspStore')||{}).value || '').trim();
  var amount = num((document.getElementById('tspAmount')||{}).value);
  var note = ((document.getElementById('tspNote')||{}).value || '').trim();
  if (!date){ toast('月日を入力してください', true); return; }
  if (!store){ toast('店舗名を入力してください', true); return; }
  if (!amount){ toast('金額を入力してください', true); return; }
  var data = {date:date, store:store, amount:amount, note:note, updatedAt:Date.now()};
  var col = state.db.collection('travelSiteExpenses/'+state.travelSiteCurrentId+'/purchases');
  var editId = state.travelSiteEditPurchaseId;
  var oldAmount = 0;
  if (editId){
    var old = state.travelSitePurchases.find(function(r){ return r.id===editId; });
    oldAmount = old ? num(old.amount) : 0;
  }
  var p = editId ? col.doc(editId).set(data,{merge:true}) : col.add(Object.assign({createdAt:Date.now()}, data));
  p.then(function(){
    state.travelSiteEditPurchaseId = null;
    toast(editId ? '更新しました' : '追加しました');
    saveTravelSiteHeader({total: num(travelSiteField('total',0)) - oldAmount + amount});
    render();
  }).catch(function(){ toast('保存に失敗しました', true); });
}

function deleteTravelSiteRow(kind, id){
  if (!state.db || !state.travelSiteCurrentId) return;
  var arr = kind==='purchases' ? state.travelSitePurchases : kind==='hospitality' ? state.travelSiteHospitality : state.travelSiteAllowances;
  var row = arr.find(function(r){ return r.id===id; });
  var amount = row ? (kind==='allowances' ? travelAllowanceAmount(row) : num(row.amount)) : 0;
  state.db.collection('travelSiteExpenses/'+state.travelSiteCurrentId+'/'+kind).doc(id).delete().then(function(){
    toast('削除しました');
    saveTravelSiteHeader({total: num(travelSiteField('total',0)) - amount});
  }).catch(function(){ toast('削除に失敗しました', true); });
}
function exportTravelSiteExcel(){

  ws.getCell(4,1).value = '工事名・現場名'; ws.getCell(4,1).font = {bold:true};
  ws.getCell(4,2).value = siteName;
  ws.getCell(4,3).value = '作業内容'; ws.getCell(4,3).font = {bold:true};
  ws.getCell(4,4).value = workContent.join('／');
  applyBorder(ws, 2, 1, 4, 4);

  var r = 6;

  r++;
  var purchaseHeaderRow = r;
  ws.getRow(r).values = ['月日','店舗名','金額','備考'];
  ws.getRow(r).font = {bold:true};

  });

  ws.getCell(r,3).value = '購入品計'; ws.getCell(r,3).font = {bold:true};

  var hospHeaderRow = r;
  ws.getRow(r).values = ['月日','店舗名','金額','備考'];
  ws.getRow(r).font = {bold:true};
  headerFill(ws, r, 1, r, 4);
  state.travelSiteHospitality.forEach(function(row){

    ws.getRow(r).values = [row.date||'', row.store||'', num(row.amount), row.note||''];
  });
  applyBorder(ws, hospHeaderRow, 1, r, 4);
  r++;
  ws.getCell(r,3).value = '接待計'; ws.getCell(r,3).font = {bold:true};

  r += 2;
  ws.getCell(r,1).value = '■昼食・夕食代補助'; ws.getCell(r,1).font = {bold:true};

  var allowHeaderRow = r;
  ws.getRow(r).values = ['月日','作業者','区分','夕食補助(宿泊)','追加費用','金額'];
  ws.getRow(r).font = {bold:true};
  headerFill(ws, r, 1, r, 6);
  state.travelSiteAllowances.forEach(function(row){
    r++;
    ws.getRow(r).values = [row.date||'', (row.workers||[]).join('／'), row.area==='out'?'県外':'県内', row.dinner?'あり':'', num(row.extra)||'', travelAllowanceAmount(row)];
  });
  applyBorder(ws, allowHeaderRow, 1, r, 6);
  r++;
  ws.getCell(r,5).value = '補助計'; ws.getCell(r,5).font = {bold:true};

  r++;
  ws.getCell(r,4).value = '仮払金'; ws.getCell(r,4).font = {bold:true};

/* ================= BENTO (弁当注文) ================= */
function todayStr(){ return ymd(TODAY.y, TODAY.m, TODAY.d); }
function activeBentoWorkers(){
  return state.workers.filter(function(w){ return w.active!==false && w.bento!==false; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function bentoMonthKey(y,m){ return yyyymm(y,m); }
function getBentoDay(doc, day){
  var key = pad2(day);
  if (doc && doc.days && doc.days[key]) return doc.days[key];
  return {};
}
function bentoDayTotal(dayMap){
  var t = 0;
  Object.keys(dayMap||{}).forEach(function(k){ t += num(dayMap[k]); });
  return t;
}
function bentoLockState(dateStr){
  if (state.adminUnlocked) return {locked:false};
  if (isHoliday(dateStr)) return {locked:true, reason:'holiday'};
  var t = todayStr();
  if (dateStr < t) return {locked:true, reason:'past'};
  if (dateStr === t){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    var cutoffMin = num(state.bentoSettings.cutoffHour)*60 + num(state.bentoSettings.cutoffMinute);
    if (nowMin >= cutoffMin) return {locked:true, reason:'cutoff'};
  }
  return {locked:false};
}
function bentoLockMessage(reason){
  if (reason==='holiday') return '休日は注文できません（管理者ロック解除で編集可）';
  if (reason==='past') return '過去の日付は編集できません（管理者ロック解除で編集可）';
  if (reason==='cutoff') return '本日の注文受付は締め切りました（管理者ロック解除で編集可）';
  return '編集できません（管理者ロック解除で編集可）';
}
function ensureBentoYM(){ if (!state.bentoYM) state.bentoYM = {y:TODAY.y, m:TODAY.m}; }
function ensureBentoSelDate(){
  if (state.bentoSelDate) return;
  if (state.bentoYM.y===TODAY.y && state.bentoYM.m===TODAY.m) state.bentoSelDate = todayStr();
}
function subscribeBentoMonth(){
  if (state.bentoDocUnsub){ state.bentoDocUnsub(); state.bentoDocUnsub = null; }
  state.bentoDoc = null;
  if (!state.db || !state.bentoYM){ render(); return; }
  var id = bentoMonthKey(state.bentoYM.y, state.bentoYM.m);
  state.bentoDocUnsub = state.db.doc('bentoOrders/' + id).onSnapshot(function(snap){
    if (state.bentoDragActive) return;
    state.bentoDoc = snap.exists ? snap.data() : {days:{}};
    render();
  });
}
function subscribeBentoToday(){
  if (!state.db) return;
  if (state.bentoTodayUnsub){ state.bentoTodayUnsub(); state.bentoTodayUnsub = null; }
  var id = bentoMonthKey(TODAY.y, TODAY.m);
  state.bentoTodayUnsub = state.db.doc('bentoOrders/' + id).onSnapshot(function(snap){
    state.bentoTodayDoc = snap.exists ? snap.data() : {days:{}};
    render();
  });
}
function applyBentoLocal(doc, key, workerId, qty){
  if (!doc.days) doc.days = {};
  if (!doc.days[key]) doc.days[key] = {};
  doc.days[key][workerId] = qty;
}
function saveBentoQty(dateStr, workerId, qty, silent){
  var parts = dateStr.split('-');
  var y = +parts[0], m = +parts[1], d = +parts[2];
  var key = pad2(d);
  var id = bentoMonthKey(y,m);

  // 楽観的更新: サーバー応答を待たず、画面にはすぐ反映する
  if (!state.bentoDoc) state.bentoDoc = {days:{}};
  applyBentoLocal(state.bentoDoc, key, workerId, qty);
  if (dateStr === todayStr()){
    if (!state.bentoTodayDoc) state.bentoTodayDoc = {days:{}};
    applyBentoLocal(state.bentoTodayDoc, key, workerId, qty);
  }

  if (!state.db) return Promise.resolve();
  var ref = state.db.doc('bentoOrders/' + id);
  // set({merge:true})は既存ドキュメントが無ければ作成し、あればネストしたオブジェクトを
  // キー単位で再帰マージする(update()のドット記法と同じ安全性を、存在チェックの
  // get()なしで実現できる)。複数マスを連続でタップ/ドラッグした際に、
  // 「get()で未存在と判定→set()で丸ごと上書き」が競合して他の人のマスの保存内容を
  // 消してしまう不具合があったため、常にmerge:trueのset()一本化した。
  var days = {}; days[key] = {}; days[key][workerId] = qty;
  return ref.set({yyyymm:id, days:days, updatedAt:Date.now()}, {merge:true}).then(function(){
    if (!silent) toast('注文を保存しました');
  }).catch(function(){
    toast('保存に失敗しました', true);
    // ローカルの楽観的表示を破棄し、サーバーの状態を取り直す
    subscribeBentoMonth();
    if (dateStr === todayStr()) subscribeBentoToday();
  });
}
function computeTodayBentoInfo(){
  var dateStr = todayStr();
  if (isHoliday(dateStr)) return {show:false};
  var dayMap = getBentoDay(state.bentoTodayDoc, TODAY.d);
  var total = bentoDayTotal(dayMap);
  if (total <= 0) return {show:false};
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  var cutoffMin = num(state.bentoSettings.cutoffHour)*60 + num(state.bentoSettings.cutoffMinute);
  return {show:true, total:total, closed: nowMin >= cutoffMin};
}
function renderBentoBanner(){
  var info = computeTodayBentoInfo();
  if (!info.show) return '';
  var phone = state.bentoSettings.phone || '';
  var telHref = 'tel:' + phone.replace(/[^0-9+]/g, '');
  if (info.closed){
    return (

  return (

      '<a class="btn btn-primary btn-sm" style="margin-top:8px" href="' + telHref + '">電話する（' + escapeHtml(phone) + '）</a>' +
    '</div>'

    return '<div class="panel"><p class="caption">弁当注文の対象作業者が設定されていません。マスター〉作業者 の「弁当注文」スイッチで設定してください。</p></div>';
  }

  var headCells = workers.map(function(w){ return '<th class="bento-name-th">' + escapeHtml(w.name) + '</th>'; }).join('');

  var bodyRows = '';
  for (var d=1; d<=dim; d++){

  var grandTotal = 0;

  var totalYenCells = workers.map(function(w){ return '<td class="bento-yen-cell">¥' + (colTotals[w.id]*unitPrice).toLocaleString() + '</td>'; }).join('');
  return (

          '<tr><td>合計/円</td>' + totalYenCells + '<td class="bento-yen-cell">¥' + (grandTotal*unitPrice).toLocaleString() + '</td></tr>' +
        '</tfoot>' +
      '</table></div>' +
      '<div class="btn-row" style="margin-top:12px">' +
        '<button class="btn" data-act="export-bento-orders">注文一覧をExcelで出力</button>' +

function exportBentoOrdersExcel(y, m, dim, workers){
  if (typeof ExcelJS === 'undefined'){ toast('Excel出力ライブラリの読み込みに失敗しました', true); return; }
  if (!workers.length){ toast('弁当注文の対象作業者がいません', true); return; }
  var unitPrice = num(state.bentoSettings.unitPrice);
  var colCount = 2 + workers.length; // 日付列 + 作業者列 + 合計列

  var wb = new ExcelJS.Workbook();
  var ws = wb.addWorksheet(safeSheetName(y + '年' + m + '月弁当注文', '弁当注文'));
  ws.columns = [{width:14}].concat(workers.map(function(){ return {width:10}; }), [{width:10}]);

  ws.mergeCells(1,1,1,colCount);
  ws.getCell(1,1).value = y + '年' + m + '月　弁当注文一覧';
  ws.getCell(1,1).font = {bold:true, size:13};

  var headerRowIdx = 3;
  ws.getRow(headerRowIdx).values = ['日付'].concat(workers.map(function(w){ return w.name; }), ['合計']);
  ws.getRow(headerRowIdx).font = {bold:true};
  headerFill(ws, headerRowIdx, 1, headerRowIdx, colCount);

  var colTotals = {};
  workers.forEach(function(w){ colTotals[w.id] = 0; });
  var r = headerRowIdx;
  for (var d=1; d<=dim; d++){
    r++;
    var dateStr = ymd(y,m,d);
    var dayMap = getBentoDay(state.bentoDoc, d);
    var rowTotal = 0;
    ws.getCell(r,1).value = m + '/' + d + '（' + DOW_LABELS[dowOf(dateStr)] + '）';
    workers.forEach(function(w, i){
      var qty = num(dayMap[w.id]);
      rowTotal += qty;
      colTotals[w.id] += qty;
      if (qty > 0) ws.getCell(r, 2+i).value = qty; // 個数なしのマスは空欄のまま
    });
    ws.getCell(r, colCount).value = rowTotal; // 行合計はゼロでも数値で表示
  }

  var grandTotal = 0;
  r++;
  ws.getCell(r,1).value = '合計/食';
  ws.getCell(r,1).font = {bold:true};
  workers.forEach(function(w, i){
    grandTotal += colTotals[w.id];
    ws.getCell(r, 2+i).value = colTotals[w.id]; // 合計はゼロでも数値で表示
  });
  ws.getCell(r, colCount).value = grandTotal;

function bindBentoOrderTable(){
  var cells = document.querySelectorAll('.order-cell');
  if (!cells.length) return;
  var touched = {};
  var changedCount = 0;
  var dragValue = 1;

  function cellFromPoint(x, y){
    var el = document.elementFromPoint(x, y);
    return el ? el.closest('.order-cell') : null;
  }
  function applyToCell(cell){
    if (!cell) return;
    var dateStr = cell.getAttribute('data-order-date');
    var workerId = cell.getAttribute('data-order-worker');
    var key = dateStr + '|' + workerId;
    if (touched[key]) return;
    touched[key] = true;
    var lock = bentoLockState(dateStr);
    if (lock.locked){ return; }
    cell.setAttribute('aria-pressed', dragValue > 0 ? 'true' : 'false');
    cell.textContent = dragValue > 0 ? String(dragValue) : '';
    changedCount++;
    saveBentoQty(dateStr, workerId, dragValue, true);
  }
  function endDrag(){
    if (!state.bentoDragActive) return;
    state.bentoDragActive = false;
    if (changedCount > 1) toast(changedCount + '件を更新しました');
    else if (changedCount === 1) toast('注文を保存しました');
    render();
  }

  cells.forEach(function(cell){
    cell.addEventListener('pointerdown', function(e){
      var dateStr = cell.getAttribute('data-order-date');
      var lock = bentoLockState(dateStr);
      if (lock.locked){ return; }
      touched = {};
      changedCount = 0;
      dragValue = (cell.getAttribute('aria-pressed') === 'true') ? 0 : 1;
      state.bentoDragActive = true;
      try { cell.setPointerCapture(e.pointerId); } catch(err){}
      applyToCell(cell);
    });
    cell.addEventListener('pointermove', function(e){
      if (!state.bentoDragActive) return;
      applyToCell(cellFromPoint(e.clientX, e.clientY));
    });
    cell.addEventListener('pointerup', endDrag);
    cell.addEventListener('pointercancel', endDrag);
  });
  document.addEventListener('pointerup', endDrag);
}

    if (total > 8){
      // 超過分＝早出残業。有休・欠勤・遅刻・早退・休出は入力なしが正しい
      var excess = round2(total - 8);
      if (round2(day.overtime) !== excess) warnKeys.push('overtime');
      ['paidLeave','absence','late','earlyLeave','holidayWork'].forEach(function(k){
        if (round2(day[k]) !== 0) warnKeys.push(k);
      });
    } else if (total > 0 && total < 8){
      // 不足分＝遅刻＋早退の合計。有休・欠勤・早出残業・休出は入力なしが正しい
      var shortfall = round2(8 - total);
      var lateEarly = round2(day.late + day.earlyLeave);
      if (lateEarly !== shortfall){ warnKeys.push('late'); warnKeys.push('earlyLeave'); }
      ['paidLeave','absence','overtime','holidayWork'].forEach(function(k){
        if (round2(day[k]) !== 0) warnKeys.push(k);
      });
    } else if (total === 8){
      // 過不足なし。有休・遅刻・早退・欠勤・早出残業・休出は入力なしが正しい
      ['paidLeave','late','earlyLeave','absence','overtime','holidayWork'].forEach(function(k){
        if (round2(day[k]) !== 0) warnKeys.push(k);
      });
    }
    if (warnKeys.length) warnMsg = '入力に誤りがあります。誤っている項目の数字を削除してください。';
    state.dayWarnKeys = warnKeys;
    // 入力中の値を消さないよう、再描画せずにハイライトだけその場で切り替える(まず全部解除)
    document.querySelectorAll('[data-field-wrap]').forEach(function(w){ w.classList.remove('field-warn'); });
    if (warnMsg){
      warnKeys.forEach(function(key){
        var wrap = document.querySelector('[data-field-wrap="'+key+'"]');
        if (wrap) wrap.classList.add('field-warn');
      });
      toast(warnMsg, true);
      return;
    }
    saveDay(state.selDate, day, function(){
      state.selDate = null;
      state.dayWarnKeys = [];
      render();
      var cal = document.querySelector('.day-grid');
      if (cal) cal.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });

function setupSummaryPullToRefresh(){
  var appEl = document.getElementById('app');
  if (!appEl || appEl._pullBound) return;
  appEl._pullBound = true;
  var PULL_THRESHOLD = 70;
  var startY = null, pulling = false, lastDy = 0;

  appEl.addEventListener('touchstart', function(e){
    var zone = document.getElementById('summaryPullZone');
    if (!zone || state.summaryRefreshing) { pulling = false; return; }
    if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) { pulling = false; return; }
    startY = e.touches[0].clientY;
    lastDy = 0;
    pulling = true;
  }, {passive:true});

  appEl.addEventListener('touchmove', function(e){
    if (!pulling || startY === null) return;
    var dy = e.touches[0].clientY - startY;
    if (dy <= 0){ lastDy = 0; return; }
    lastDy = dy;
    var ind = document.getElementById('pullIndicator');
    if (ind){
      ind.style.display = 'flex';
      ind.style.opacity = Math.min(dy / PULL_THRESHOLD, 1);
      var txt = document.getElementById('pullIndicatorText');
      if (txt) txt.textContent = dy > PULL_THRESHOLD ? '離すと更新' : '↓ 引っ張って更新';
    }
  }, {passive:true});

  appEl.addEventListener('touchend', function(){
    if (!pulling) return;
    pulling = false;
    startY = null;
    var ind = document.getElementById('pullIndicator');
    if (ind){ ind.style.display = 'none'; ind.style.opacity = ''; }
    var dy = lastDy;
    lastDy = 0;
    if (dy > PULL_THRESHOLD && !state.summaryRefreshing) refreshSummary();
  }, {passive:true});
}

  }
  document.querySelectorAll('[data-worker-move-up]').forEach(function(el){
    el.addEventListener('click', function(){ moveWorker(el.getAttribute('data-worker-move-up'), -1); });
  });
  document.querySelectorAll('[data-worker-move-down]').forEach(function(el){
    el.addEventListener('click', function(){ moveWorker(el.getAttribute('data-worker-move-down'), 1); });
  });
  var saveBentoSettingsBtn = document.querySelector('[data-act="save-bento-settings"]');
  if (saveBentoSettingsBtn) saveBentoSettingsBtn.addEventListener('click', function(){
    var phone = (document.getElementById('bentoPhoneInput').value||'').trim();
    var unitPrice = num(document.getElementById('bentoUnitPriceInput').value);
    var subsidyPerUnit = num(document.getElementById('bentoSubsidyInput').value);
    var notifyEmails = (document.getElementById('bentoNotifyEmailsInput').value||'')
      .split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s; });
    var cutoffRaw = (document.getElementById('bentoCutoffInput').value||'').split(':');
    var cutoffHour = cutoffRaw.length===2 ? (+cutoffRaw[0]) : num(state.bentoSettings.cutoffHour);
    var cutoffMinute = cutoffRaw.length===2 ? (+cutoffRaw[1]) : num(state.bentoSettings.cutoffMinute);
    if (!phone){ toast('電話番号を入力してください', true); return; }
    if (!isFinite(cutoffHour) || !isFinite(cutoffMinute)){ toast('締め切り時刻を入力してください', true); return; }
    state.db.doc('settings/bento').set({phone:phone, unitPrice:unitPrice, subsidyPerUnit:subsidyPerUnit, notifyEmails:notifyEmails, cutoffHour:cutoffHour, cutoffMinute:cutoffMinute}, {merge:true}).then(function(){
      toast('保存しました');
    });
  });
  document.querySelectorAll('[data-del-worker]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-del-worker');
      confirmModal('作業者を削除しますか？', '入力済みのデータは残りますが、選択肢から表示されなくなります。', function(){
        state.db.collection('workers').doc(id).delete().then(function(){ toast('削除しました'); });
      });
    });
  });

  var addItemBtn = document.querySelector('[data-act="add-item"]');
  if (addItemBtn) addItemBtn.addEventListener('click', function(){
    var codeInput = document.getElementById('newItemCode');
    var contractorInput = document.getElementById('newItemContractor');
    var nameInput = document.getElementById('newItemName');
    var code = codeInput.value.trim();
    var contractor = contractorInput.value.trim();
    var name = nameInput.value.trim();
    if (!code || !name) { toast('製番と名称を入力してください', true); return; }
    state.db.collection('workItems').doc(code).get().then(function(snap){
      if (snap.exists){ toast('この製番はすでに登録されています', true); return; }
      var order = state.workItems.length ? Math.max.apply(null, state.workItems.map(function(w){return w.order||0;}))+1 : 0;
      return state.db.collection('workItems').doc(code).set({code:code, name:name, contractor:contractor, order:order, active:true}).then(function(){
        toast('追加しました'); codeInput.value=''; contractorInput.value=''; nameInput.value='';
      });
    });
  });
  document.querySelectorAll('[data-toggle-item]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-toggle-item');
      var it = state.workItems.find(function(x){return x.id===id;});
      state.db.collection('workItems').doc(id).update({active: !(it.active!==false)});
    });
  });
  document.querySelectorAll('[data-edit-item]').forEach(function(el){
    el.addEventListener('click', function(){
      openItemEditModal(el.getAttribute('data-edit-item'));
    });
  });
  document.querySelectorAll('[data-del-item]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-del-item');
      confirmModal('作業内容を削除しますか？', '過去の入力データには影響しません。', function(){
        state.db.collection('workItems').doc(id).delete().then(function(){ toast('削除しました'); });
      });
    });
  });

  document.querySelectorAll('[data-addtm-field]').forEach(function(el){
    el.addEventListener('click', function(){
      var field = el.getAttribute('data-addtm-field');
      var input = document.querySelector('[data-addtm-input="'+field+'"]');
      var v = (input.value||'').trim();
      if (!v){ toast('入力してください', true); return; }
      var cur = (state.travelMaster[field]||[]).slice();
      if (cur.indexOf(v) !== -1){ toast('すでに登録されています', true); return; }
      cur.push(v);
      var patch = {}; patch[field] = cur;
      state.db.doc('settings/travelMaster').set(patch, {merge:true}).then(function(){
        toast('追加しました'); input.value = '';
      });
    });
  });
  document.querySelectorAll('[data-deltm-field]').forEach(function(el){
    el.addEventListener('click', function(){
      var field = el.getAttribute('data-deltm-field');
      var value = el.getAttribute('data-deltm-value');
      var cur = (state.travelMaster[field]||[]).filter(function(x){ return x !== value; });
      var patch = {}; patch[field] = cur;
      state.db.doc('settings/travelMaster').set(patch, {merge:true}).then(function(){ toast('削除しました'); });
    });
  });
  var saveDefaultStaffBtn = document.querySelector('[data-act="save-travel-default-staff"]');
  if (saveDefaultStaffBtn) saveDefaultStaffBtn.addEventListener('click', function(){
    var v = (document.getElementById('travelDefaultStaffInput').value||'').trim();
    if (!v){ toast('氏名を入力してください', true); return; }
    state.db.doc('settings/travelMaster').set({defaultStaff:v}, {merge:true}).then(function(){ toast('保存しました'); });
  });

  document.querySelectorAll('[data-dow]').forEach(function(el){
    el.addEventListener('click', function(){
      var dow = +el.getAttribute('data-dow');
      var cur = (state.holidaySettings.weeklyOff||[]).slice();
      var idx = cur.indexOf(dow);
      if (idx===-1) cur.push(dow); else cur.splice(idx,1);
      state.db.doc('settings/holiday').set({weeklyOff:cur});
    });
  });
  var addHolidayBtn = document.querySelector('[data-act="add-holiday"]');
  if (addHolidayBtn) addHolidayBtn.addEventListener('click', function(){
    var dateEl = document.getElementById('newHolidayDate');
    var typeEl = document.getElementById('newHolidayType');
    var labelEl = document.getElementById('newHolidayLabel');
    if (!dateEl.value){ toast('日付を選択してください', true); return; }
    state.db.collection('holidays').doc(dateEl.value).set({type:typeEl.value, label:labelEl.value||''}).then(function(){
      toast('登録しました'); dateEl.value=''; labelEl.value='';
    });
  });
  document.querySelectorAll('[data-del-holiday]').forEach(function(el){
    el.addEventListener('click', function(){
      var dt = el.getAttribute('data-del-holiday');
      state.db.collection('holidays').doc(dt).delete().then(function(){ toast('削除しました'); });
    });
  });

  var changeBtn = document.querySelector('[data-act="admin-change"]');
  if (changeBtn) changeBtn.addEventListener('click', function(){
    var p1 = document.getElementById('pwNew1').value;
    var p2 = document.getElementById('pwNew2').value;
    if (!p1 || p1.length < 3){ toast('3文字以上で入力してください', true); return; }
    if (p1 !== p2){ toast('パスワードが一致しません', true); return; }
    sha256Hex(p1).then(function(hash){
      return state.db.doc('settings/admin').set({passwordHash: hash, updatedAt: Date.now()});
    }).then(function(){ toast('パスワードを変更しました'); });
  });

  var gateChangeBtn = document.querySelector('[data-act="gate-change"]');
  if (gateChangeBtn) gateChangeBtn.addEventListener('click', function(){
    var p1 = document.getElementById('gateNew1').value.trim();
    var p2 = document.getElementById('gateNew2').value.trim();
    if (!p1 || p1.length < 2){ toast('2文字以上で入力してください', true); return; }
    if (p1 !== p2){ toast('入力が一致しません', true); return; }
    sha256Hex('gate::' + p1).then(function(hash){
      return state.db.doc('settings/access').set({codeHash: hash, updatedAt: Date.now()});
    }).then(function(){ toast('アクセスコードを変更しました'); });
  });
}

/* ================= boot ================= */
render();
initDb();

})();
</script>
</body>
</html>
